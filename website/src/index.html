<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWithAIvan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('index-cover.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }


        .container {
            text-align: center;
            color: white;
            z-index: 1;
            padding: 20px;
            max-width: 800px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            min-width: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
        }

        .countdown-number {
            font-size: 3rem;
            font-weight: 700;
            display: block;
            line-height: 1;
        }

        .countdown-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-top: 0.5rem;
        }



        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .logo {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .countdown {
                gap: 1rem;
            }

            .countdown-item {
                padding: 1rem 1.5rem;
                min-width: 80px;
            }

            .countdown-number {
                font-size: 2rem;
            }

            .notify-form {
                flex-direction: column;
                align-items: stretch;
            }

            .email-input {
                min-width: 100%;
            }
        }


        .social-links-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .youtube-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: rgba(255, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .youtube-link:hover {
            background: rgba(255, 0, 0, 0.25);
            border-color: rgba(255, 0, 0, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.3);
        }

        .youtube-icon {
            font-size: 1.5rem;
        }

        .discord-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: rgba(88, 101, 242, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(88, 101, 242, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .discord-link:hover {
            background: rgba(88, 101, 242, 0.25);
            border-color: rgba(88, 101, 242, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.3);
        }

        .discord-icon {
            font-size: 1.5rem;
        }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: rgba(225, 48, 108, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(225, 48, 108, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .instagram-link:hover {
            background: rgba(225, 48, 108, 0.25);
            border-color: rgba(225, 48, 108, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(225, 48, 108, 0.3);
        }

        .instagram-icon {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">&#x1F680;</div>
        <h1>COMING SOON</h1>
        <p class="subtitle">Something awesome is in the works</p>

        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <div class="social-links-container">
            <a href="https://www.youtube.com/@CodeWithAIvan" target="_blank" rel="noopener noreferrer" class="youtube-link">
                <span class="youtube-icon">&#9654;</span>
                <span>YouTube Channel</span>
            </a>
            <a href="https://discord.gg/pxZ3FsRUgq" target="_blank" rel="noopener noreferrer" class="discord-link">
                <span class="discord-icon">&#x1F4AC;</span>
                <span>Join Discord</span>
            </a>
            <a href="https://www.instagram.com/codewithaivan/" target="_blank" rel="noopener noreferrer" class="instagram-link">
                <span class="instagram-icon">&#x1F4F7;</span>
                <span>Instagram</span>
            </a>
        </div>
    </div>

    <script>
        // Countdown timer with localStorage
        function updateCountdown() {
            const STORAGE_KEY = 'countdownLaunchDate';
            let launchDate;

            // Check if we have a stored launch date
            const storedDate = localStorage.getItem(STORAGE_KEY);

            if (storedDate) {
                launchDate = new Date(parseInt(storedDate));
            } else {
                // First time visitor - set launch date to 30 days from now
                launchDate = new Date();
                launchDate.setDate(launchDate.getDate() + 30);
                localStorage.setItem(STORAGE_KEY, launchDate.getTime().toString());
            }

            function update() {
                const now = new Date().getTime();
                const distance = launchDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                // Check if we hit 1 day or less - reset to 30 days
                if (days <= 1 && days >= 0) {
                    launchDate = new Date();
                    launchDate.setDate(launchDate.getDate() + 30);
                    localStorage.setItem(STORAGE_KEY, launchDate.getTime().toString());
                    return; // Will update on next interval
                }

                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

                if (distance < 0) {
                    // Reset to 30 days
                    launchDate = new Date();
                    launchDate.setDate(launchDate.getDate() + 30);
                    localStorage.setItem(STORAGE_KEY, launchDate.getTime().toString());
                }
            }

            update();
            const countdownInterval = setInterval(update, 1000);
        }

        // Initialize
        updateCountdown();
    </script>
</body>
</html>
